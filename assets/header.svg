<svg width="1200" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#FF8C5A"/>
      <stop offset="100%" stop-color="#e84118"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      <animate attributeName="x1" values="-100%;100%" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.12)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" fill="url(#bg)"/>

  <!-- Dot pattern -->
  <rect width="1200" height="220" fill="url(#dots)"/>

  <!-- Shimmer -->
  <rect width="1200" height="220" fill="url(#shimmer)"/>

  <!-- Decorative circles -->
  <circle cx="90" cy="110" r="85" fill="rgba(255,255,255,0.04)"/>
  <circle cx="90" cy="110" r="55" fill="rgba(255,255,255,0.04)"/>
  <circle cx="1110" cy="110" r="65" fill="rgba(255,255,255,0.04)"/>
  <circle cx="1110" cy="110" r="35" fill="rgba(255,255,255,0.04)"/>
  <circle cx="980" cy="40" r="25" fill="rgba(255,255,255,0.06)"/>
  <circle cx="220" cy="180" r="20" fill="rgba(255,255,255,0.06)"/>

  <!-- Decorative lines -->
  <line x1="250" y1="185" x2="380" y2="185" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <line x1="820" y1="35" x2="950" y2="35" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Code brackets decoration -->
  <text x="420" y="105" fill="rgba(255,255,255,0.15)" font-family="'Courier New', monospace" font-size="60" font-weight="300">{</text>
  <text x="745" y="105" fill="rgba(255,255,255,0.15)" font-family="'Courier New', monospace" font-size="60" font-weight="300">}</text>

  <!-- Main text -->
  <text x="600" y="95" text-anchor="middle" fill="white" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="3">
    Code Dream Workshop
  </text>

  <!-- Subtitle -->
  <text x="600" y="135" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="4">
    JAVA &amp; PYTHON FULL STACK DEVELOPER
  </text>

  <!-- Center accent line -->
  <rect x="510" y="152" width="180" height="2" rx="1" fill="rgba(255,255,255,0.35)"/>

  <!-- Diamond accents -->
  <rect x="498" y="147" width="8" height="8" rx="1" fill="rgba(255,255,255,0.4)" transform="rotate(45 502 151)"/>
  <rect x="694" y="147" width="8" height="8" rx="1" fill="rgba(255,255,255,0.4)" transform="rotate(45 698 151)"/>

  <!-- Floating particles -->
  <circle cx="300" cy="60" r="2" fill="rgba(255,255,255,0.2)">
    <animate attributeName="cy" values="60;50;60" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="180" r="1.5" fill="rgba(255,255,255,0.2)">
    <animate attributeName="cy" values="180;170;180" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="45" r="2" fill="rgba(255,255,255,0.2)">
    <animate attributeName="cy" values="45;35;45" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="170" r="1.5" fill="rgba(255,255,255,0.2)">
    <animate attributeName="cy" values="170;160;170" dur="3.2s" repeatCount="indefinite"/>
  </circle>
</svg>
